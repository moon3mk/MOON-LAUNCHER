plugins {
    id 'java'
    id 'application'
}

group = 'dev.moon'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'dev.moon.loader.Main'
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': 'MOON3MK Loader',
            'Implementation-Version': project.version
        )
    }
}
