name: Build MOON3MK Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npm run build

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: MOON3MK-Windows
          path: dist/*.exe
          if-no-files-found: error
